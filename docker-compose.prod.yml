services:
  postgres:
    image: postgres:16-alpine
    container_name: itamls_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: itamls_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # admin console only — bucket access is internal

  redis:
    image: redis:7-alpine
    container_name: itamls_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: itamls_api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_started }
      redis:    { condition: service_started }
    environment:
      DATABASE_URL:       "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      JWT_SECRET:         ${JWT_SECRET}
      JWT_EXPIRES_IN:     "1d"
      PORT:               "4000"
      CORS_ORIGIN:        ${WEB_BASE_URL}
      WEB_BASE_URL:       ${WEB_BASE_URL}
      MINIO_ENDPOINT:         "minio"
      MINIO_PORT:             "9000"
      MINIO_USE_SSL:          "false"
      MINIO_ACCESS_KEY:       ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY:       ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:           "itamls-invoices"
      # Public MinIO reached via the main site's /minio/* path proxy.
      # Signer uses host:port of the main site; path prefix is injected after
      # signing and stripped by Caddy before MinIO sees it (SigV4-safe).
      MINIO_PUBLIC_ENDPOINT:     ${MINIO_PUBLIC_ENDPOINT:-${APP_FQDN:-it.ffgsa.co.za}}
      MINIO_PUBLIC_PORT:         ${MINIO_PUBLIC_PORT:-${WEB_PORT:-41235}}
      MINIO_PUBLIC_USE_SSL:      ${MINIO_PUBLIC_USE_SSL:-true}
      MINIO_PUBLIC_PATH_PREFIX:  ${MINIO_PUBLIC_PATH_PREFIX:-/minio}
      TOTP_ISSUER:        ${TOTP_ISSUER}
      HELPDESK_SYSTEM:    ${HELPDESK_SYSTEM:-STUB}
      PRICE_LOOKUP_PROVIDER: ${PRICE_LOOKUP_PROVIDER:-SEARCH_LINKS}
      SMTP_HOST:          ${SMTP_HOST:-}
      SMTP_PORT:          ${SMTP_PORT:-587}
      SMTP_SECURE:        ${SMTP_SECURE:-false}
      SMTP_USER:          ${SMTP_USER:-}
      SMTP_PASS:          ${SMTP_PASS:-}
      SMTP_FROM:          ${SMTP_FROM:-ITAMLS <no-reply@fashionfusion.local>}
      # In-app self-updater — where the repo lives on the host + inside the container
      REPO_DIR:           "/repo"
      HOST_REPO_PATH:     ${HOST_REPO_PATH:-/opt/itamls}
    volumes:
      # Live repo for the self-updater to git-pull and compare commits
      - ${HOST_REPO_PATH:-/opt/itamls}:/repo
      # Docker socket so the API can spawn the detached updater container
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: itamls_web
    restart: unless-stopped
    depends_on:
      - api
    # No public ports -- Caddy is the only thing exposed to the internet.
    expose:
      - "80"

  # Reverse proxy + automatic TLS via Let's Encrypt.
  # Listens on:
  #   80          -- HTTP-01 ACME challenge only, then 301 redirect to HTTPS
  #   ${WEB_PORT} -- the actual app on HTTPS (matches the external URL:
  #                  https://it.ffgsa.co.za:41235)
  # Router NAT on the ITAMLS server's uplink needs to forward both public 80
  # and public ${WEB_PORT} to the server. Port 80 is required (even briefly)
  # for Let's Encrypt to issue and renew certs via the HTTP-01 challenge.
  caddy:
    image: caddy:2-alpine
    container_name: itamls_caddy
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      # Single HTTPS port — API, SPA, and MinIO (/minio/*) all served here
      - "${WEB_PORT:-41235}:${WEB_PORT:-41235}"
    environment:
      APP_FQDN:  ${APP_FQDN:-it.ffgsa.co.za}
      WEB_PORT:  ${WEB_PORT:-41235}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  redis_data:
  caddy_data:
  caddy_config:
