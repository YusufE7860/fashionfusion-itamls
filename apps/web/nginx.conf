server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aggressive caching for built assets — they're hash-fingerprinted by Vite
    # so a new build produces new filenames and the old cache is harmless.
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html MUST NOT be cached — it's the pointer to the currently-live
    # /assets/*.js bundles. If a browser caches it, the app "never updates"
    # even after a successful deploy because the browser keeps loading the old
    # bundle hashes. Force revalidation on every page load.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # API requests proxied to the api container on the docker network
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow larger uploads (invoices, signatures, decommission certs)
        client_max_body_size 32M;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # SPA fallback — every non-asset, non-API path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
